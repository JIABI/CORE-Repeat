[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opal2-measurement-model"
version = "0.2.0"
description = "Structured conditional measurement models and acquisition evaluation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12", "pandas>=2.1", "pyarrow>=15", "scikit-learn>=1.4", "torch>=2.5", "rdkit>=2024.3", "mpmath>=1.3", "joblib>=1.3", "threadpoolctl>=3.2"]

[project.optional-dependencies]
test = ["pytest>=8"]
figures = ["matplotlib>=3.8", "pillow>=10"]

[project.scripts]
opal2 = "opal2.cli:main"

[tool.setuptools.packages.find]
include = ["opal2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
